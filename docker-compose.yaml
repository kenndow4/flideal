version: "3.9"

services:
  backend:
    build: ./backend
    container_name: flight-backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    container_name: flight-frontend
    ports: 
      - "3000:3000"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend

  mongo:
    image: mongo:5
    container_name: mongo
    ports:
      - "27017:27017"